<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestion professionnelle CM Pro">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

<body>
  <div id="cm-pro-startup" role="status" aria-live="polite" style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#f5f6f8;color:#263238;font:18px system-ui;text-align:center">
    <div><strong style="display:block;font-size:28px;margin-bottom:16px">CM Pro</strong>Ouverture de votre espace…</div>
  </div>
  <!-- CM_PRO_FIRST_FRAME_START -->
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('cm-pro-startup')?.remove();
    }, {once: true});
  </script>
  <!-- CM_PRO_FIRST_FRAME_END -->
  <!--

  <script src="flutter_bootstrap.js" async></script>
  <script src="cm_pro_update.js" defer></script>
  <script>
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  </script>
